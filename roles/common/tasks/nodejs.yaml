- name: Disable mongodb-mongosh repo if present
  shell: |
    dnf config-manager --disable mongodb-mongosh || true
  ignore_errors: yes

- name: Clean DNF cache
  shell: dnf clean all

- name: enable nodejs 20
  command: dnf module enable nodejs:20 -y

- name: install nodejs 20
  package:
    name: nodejs
    state: present
    
- name: install dependencies
  community.general.npm:
    path: /app